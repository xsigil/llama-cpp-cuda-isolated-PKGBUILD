# Configuration for isolated llama.cpp daemon
# Location: /etc/conf.d/llama-isolated
# Network bindings (bind to 127.0.0.1 for local isolation, or 0.0.0.0 for LAN exposure)

LLAMA_HOST="127.0.0.1"
LLAMA_PORT="8080"

# Model configuration

LLAMA_MODEL_DIR="/srv/llama/models"
LLAMA_MODEL_FILE="model.gguf"

# Engine configuration

LLAMA_CTX_SIZE="8192"
LLAMA_N_GPU_LAYERS="99"
LLAMA_THREADS="$(nproc)"

# Jail specifications

JAIL_ROOT="/run/llama-jail"
JAIL_TMPFS_SIZE="512M"
